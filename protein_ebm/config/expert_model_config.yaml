diffuser:
  min_b: 0.1
  max_b: 20.0
  coordinate_scaling: 0.1


model:
  direct_score: False
  aux_score: True
  diffuse_sidechain: False
  use_self_conditioning: True
  predict_sidechain: True
  token_s: 256
  token_z: 128
  dim_fourier: 256
  conditioning_transition_layers: 2
  token_transformer_depth: 16
  token_transformer_heads: 8
  use_contact_embeddings: True
  num_contact_embeddings: 3
  use_attention_mask: False  # Enable time-dependent attention masking (cutoff = 55.46*t + 12.24 for t < 0.5, no masking for t >= 0.5)


training:
  run_name: "proteinebm_expert_pretrained"  # Name for the experiment
  compute_spearman_val: True
  batch_size: 1
  max_epochs: 60
  pad_to_max_threshold: 500
  max_len: 500
  val_check_interval: 1.0
  learning_rate: .0001
  gpus: 2  # Number of GPUs to use
  num_nodes: 3
  max_t: 0.15
  eval_time: 0.05
  log_dir: "/home/gridsan/jroney/solab/ProteinEBM-training/cath_cartesian/logs/"
  grad_accum: 6
  self_conditioning: True
  trans_score_weight: 3.0 
  aux_score_weight: 0.25
  sidechain_weight: 0.25
  mask_sequence: False
  drop_seq_prob: 0.1
  zero_complex_chain_ids: True 
  lr_scheduler:
    pct_start: 0.3
    div_factor: 25.0
    final_div_factor: 10000

data:
  afdb_multiplier: 1.0
  complex_multiplier: 1.0
  train_data_path: ../../eval_data/training_data/cath_domain_data_threecontact.pt  
  afdb_data_path: ../../eval_data/training_data/afdb_domain_data_threecontact.pt
  complex_data_path: ../../eval_data/training_data/training_dsmbind_complex_data_strict_ff_contacts.pt
  validation_data_path: ../../eval_data/val_protein_data.pt
  blocked_training_ids: ../data/data_lists/blocked_ids_combined_structure_split.txt
